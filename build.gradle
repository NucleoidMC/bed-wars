plugins {
  id 'net.fabricmc.fabric-loom' version "${loom_version}"
  id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
  accessWidenerPath = file("src/main/resources/bedwars.accesswidener")
}

repositories {
  maven { url = "https://maven.nucleoid.xyz/" }
  maven { url = "https://maven.gegy.dev/" }
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  implementation "net.fabricmc:fabric-loader:${project.loader_version}"

  implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

  implementation "xyz.nucleoid:plasmid:${project.plasmid_version}"
  implementation "xyz.nucleoid:substrate:0.3.0+26.1.2"
  implementation include('kdotjpg:open-simplex:2.0')
}

processResources {
  inputs.property "version", project.version

  filesMatching("fabric.mod.json") {
    expand "version": project.version
  }
}

tasks.withType(JavaCompile).configureEach {
  it.options.encoding = "UTF-8"
  it.options.release = 25
}

java {
  withSourcesJar()

  sourceCompatibility = JavaVersion.VERSION_25
  targetCompatibility = JavaVersion.VERSION_25
}

jar {
  inputs.property "archivesName", project.base.archivesName

  from("LICENSE") {
    rename { "${it}_${inputs.properties.archivesName}"}
  }
}
